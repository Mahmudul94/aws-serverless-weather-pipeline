
name: Weather Pipeline CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile weather_data_extract.py
          python -m py_compile transform_weather_data.py

      - name: Confirm CI completed
        run: echo "Weather pipeline CI passed!"

