
name: Weather Pipeline CD

on:
  push:
    branches: [main]
    paths:
      - "weather_data_extract.py"
      - "transform_weather_data.py"
      - "lambda_function.py"
      - "requirements.txt"
      - ".github/workflows/weather-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  LAMBDA_FUNCTION: nyc-weather-pipeline
  DEPLOY_BUCKET: nyc-weather-pipeline-unique124

jobs:
  deploy:
    name: Deploy Weather Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile weather_data_extract.py
          python -m py_compile transform_weather_data.py
          python -m py_compile lambda_function.py

      - name: Install dependencies for Lambda ARM64
        run: |
          mkdir -p build/package

          python -m pip install --no-cache-dir --no-compile \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            -r requirements.txt \
            -t build/package

      - name: Remove dependency test files
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          package = Path("build/package")

          for name in (
              "pandas/tests",
              "numpy/tests",
              "pyarrow/tests",
          ):
              directory = package / name
              if directory.is_dir():
                  shutil.rmtree(directory)
                  print(f"Removed {directory}")
          PY

          du -sh build/package
          du -sh build/package/* | sort -h | tail -15

      - name: Package Lambda code
        run: |
          cp weather_data_extract.py build/package/
          cp transform_weather_data.py build/package/
          cp lambda_function.py build/package/

          cd build/package
          zip -q -r ../weather-lambda.zip .

      - name: Check deployment size
        run: |
          SIZE=$(du -sb build/package | cut -f1)
          echo "Uncompressed package: $SIZE bytes"

          if [ "$SIZE" -gt 262144000 ]; then
            echo "Package exceeds Lambda 250 MiB limit."
            echo "Use a container image deployment instead."
            exit 1
          fi
      - name: Check OIDC identity
        shell: python
        run: |
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for field in ("iss", "aud", "sub"):
              print(f"{field}: {claims.get(field)}")

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::312816041167:role/github-weather-deploy-role
          aws-region: us-east-2

      - name: Upload deployment package to S3
        run: |
          aws s3 cp build/weather-lambda.zip \
            s3://$DEPLOY_BUCKET/deploy-artifacts/weather-lambda.zip

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --s3-bucket "$DEPLOY_BUCKET" \
            --s3-key deploy-artifacts/weather-lambda.zip \
            --region "$AWS_REGION"

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"

      - name: Confirm deployment
        run: |
          aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --query '{Name:FunctionName,Status:LastUpdateStatus}' \
            --output table
        

